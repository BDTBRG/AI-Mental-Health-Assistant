map $http_x_verification_id $verification_id {
    default "-";
    "~*^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" $http_x_verification_id;
}

upstream spring_backend {
    server api-1:8080;
    server api-2:8080;
    keepalive 32;
}

upstream agent_backend {
    server agent-1:5000;
    server agent-2:5000;
    keepalive 16;
}

log_format upstreams '$time_iso8601 probe=$verification_id method=$request_method status=$status '
                     'upstream=$upstream_addr upstream_status=$upstream_status '
                     'request_time=$request_time';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout upstreams;
    error_log /dev/stderr warn;

    location = /_gateway_health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://spring_backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
        proxy_buffering off;
        proxy_cache off;
    }

    location ^~ /file/uploads/ {
        proxy_pass http://spring_backend/file/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Private listener used only by Spring instances for Agent traffic.
server {
    listen 5000;
    server_name _;

    access_log /dev/stdout upstreams;
    error_log /dev/stderr warn;

    location = /_gateway_health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/agent/ {
        proxy_pass http://agent_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 610s;
        proxy_send_timeout 610s;
        proxy_buffering off;
        proxy_cache off;
    }

    location / {
        return 404;
    }
}
