x-agent-environment: &agent-environment
  AGENT_HOST: 0.0.0.0
  AGENT_PORT: 5000
  AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:?Set AGENT_INTERNAL_TOKEN in .env.compose}
  AGENT_CHECKPOINT_BACKEND: postgres
  AGENT_CHECKPOINT_POSTGRES_DSN: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env.compose}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.compose}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env.compose}
  RAG_BACKEND: qdrant
  RAG_QDRANT_URL: http://qdrant:6333
  RAG_QDRANT_COLLECTION_ALIAS: mental_health_knowledge
  RAG_WRITE_LOCK_REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.compose}@redis:6379/0
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
  HF_HOME: /opt/huggingface
  TOKENIZERS_PARALLELISM: "false"

x-agent-image: &agent-image
  image: ningdu-mind-agent:${COMPOSE_PROJECT_NAME:-local}
  build:
    context: .
    dockerfile: agent/Dockerfile

x-agent-service: &agent-service
  <<: *agent-image
  environment: *agent-environment
  restart: unless-stopped
  stop_grace_period: 40s
  volumes:
    - agent-model-cache:/opt/huggingface
  expose:
    - "5000"
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/agent/health/ready', timeout=25)"
    interval: 30s
    timeout: 30s
    retries: 3
    start_period: 120s
  networks:
    private: {}
    agent-egress: {}

x-api-environment: &api-environment
  SPRING_PROFILES_ACTIVE: demo
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/amha?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true"
  SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:?Set MYSQL_USER in .env.compose}
  SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.compose}
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: 6379
  SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.compose}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.compose}
  AGENT_BASE_URL: http://agent-gateway:5000
  AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:?Set AGENT_INTERNAL_TOKEN in .env.compose}
  FILE_UPLOAD_BACKEND: minio
  FILE_UPLOAD_S3_ENDPOINT: http://rustfs:9000
  FILE_UPLOAD_S3_BUCKET: ${FILE_UPLOAD_S3_BUCKET:?Set FILE_UPLOAD_S3_BUCKET in .env.compose}
  FILE_UPLOAD_S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in .env.compose}
  FILE_UPLOAD_S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env.compose}
  SERVER_SHUTDOWN: graceful
  SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 30s
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: readinessState,db,redis
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0

x-api-service: &api-service
  image: ningdu-mind-server:${COMPOSE_PROJECT_NAME:-local}
  build:
    context: .
    dockerfile: server/Dockerfile
  environment: *api-environment
  restart: unless-stopped
  stop_grace_period: 40s
  expose:
    - "8080"
  healthcheck:
    test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:8080/actuator/health/readiness || exit 1
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 90s
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    object-store-init:
      condition: service_completed_successfully
  networks:
    - private

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: amha
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env.compose}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.compose}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.compose}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./server/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
          && test "$$(mysql -N -B -uroot -p"$${MYSQL_ROOT_PASSWORD}" -e
          "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='amha' AND table_name='consultation_session'")" = "1"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - private

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.compose}
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.compose}
    networks:
      - private

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.compose}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.compose}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.compose}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - private

  qdrant:
    image: qdrant/qdrant:v1.15.4
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped
    networks:
      - private

  qdrant-ready:
    <<: *agent-image
    entrypoint: ["python", "-c"]
    command:
      - |
        import time
        import urllib.request

        deadline = time.monotonic() + 120
        while time.monotonic() < deadline:
            try:
                remaining = deadline - time.monotonic()
                with urllib.request.urlopen("http://qdrant:6333/readyz", timeout=min(3, remaining)) as response:
                    if response.status == 200:
                        break
            except Exception:
                pass
            time.sleep(min(2, max(0, deadline - time.monotonic())))
        else:
            raise RuntimeError("Qdrant did not become ready within 120 seconds")
    restart: "no"
    depends_on:
      qdrant:
        condition: service_started
    networks:
      - private

  rustfs:
    image: rustfs/rustfs:1.0.1
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in .env.compose}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env.compose}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - object-storage-data:/data
    restart: unless-stopped
    expose:
      - "9000"
    networks:
      - private

  object-store-init:
    image: amazon/aws-cli:2.36.44
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        attempt=0
        until aws --endpoint-url http://rustfs:9000 s3api list-buckets >/dev/null 2>&1; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -ge 60 ]; then
            echo "RustFS did not become available within 120 seconds" >&2
            exit 1
          fi
          sleep 2
        done
        if ! aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket "$${FILE_UPLOAD_S3_BUCKET}" >/dev/null 2>&1; then
          aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket "$${FILE_UPLOAD_S3_BUCKET}"
        fi
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket "$${FILE_UPLOAD_S3_BUCKET}" >/dev/null
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in .env.compose}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env.compose}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      FILE_UPLOAD_S3_BUCKET: ${FILE_UPLOAD_S3_BUCKET:?Set FILE_UPLOAD_S3_BUCKET in .env.compose}
    restart: "no"
    depends_on:
      rustfs:
        condition: service_started
    networks:
      - private

  agent-1:
    <<: *agent-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant-ready:
        condition: service_completed_successfully

  agent-2:
    <<: *agent-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant-ready:
        condition: service_completed_successfully
      agent-1:
        condition: service_healthy

  api-1:
    <<: *api-service

  api-2:
    <<: *api-service

  gateway:
    image: ningdu-mind-web:${COMPOSE_PROJECT_NAME:-local}
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
      agent-1:
        condition: service_healthy
      agent-2:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, wget -q -O /dev/null http://127.0.0.1:8080/_gateway_health || exit 1]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      private:
        aliases:
          - agent-gateway
      edge: {}

volumes:
  mysql-data:
  redis-data:
  postgres-data:
  qdrant-data:
  object-storage-data:
  agent-model-cache:

networks:
  private:
    internal: true
  agent-egress:
    driver: bridge
  edge:
    driver: bridge
