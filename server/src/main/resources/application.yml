spring:
  application:
    name: amha-server

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/amha?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: ${MYSQL_PASSWORD:123456}

  data:
    redis:
      host: localhost
      port: 6379

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000

# File upload config
file:
  upload:
    path: ./uploads
    allowed-extensions: jpg,jpeg,png,gif,webp
    max-size-bytes: 5242880
    max-image-pixels: 25000000

# Python AI Agent config
agent:
  base-url: http://localhost:5000
  internal-token: ${AGENT_INTERNAL_TOKEN:}

app:
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:2000}
