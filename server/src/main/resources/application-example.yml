spring:
  application:
    name: amha-server

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/amha?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: your_mysql_password

  data:
    redis:
      host: localhost
      port: 6379

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000

# File upload config
file:
  upload:
    backend: ${FILE_STORAGE_BACKEND:local} # local | minio
    path: ./uploads
    allowed-extensions: jpg,jpeg,png,gif,webp
    max-size-bytes: 5242880
    max-image-pixels: 25000000
    s3:
      endpoint: ${MINIO_ENDPOINT:}
      bucket: ${MINIO_BUCKET:}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
    migration:
      enabled: ${FILE_STORAGE_MIGRATION_ENABLED:false}
      dry-run: ${FILE_STORAGE_MIGRATION_DRY_RUN:true}
      batch-size: ${FILE_STORAGE_MIGRATION_BATCH_SIZE:100}

# Python AI Agent config
agent:
  base-url: http://localhost:5000
  internal-token: ${AGENT_INTERNAL_TOKEN:}
