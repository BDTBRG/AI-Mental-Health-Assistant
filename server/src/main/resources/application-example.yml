spring:
  application:
    name: amha-server

  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/amha?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: your_mysql_password

  data:
    redis:
      host: localhost
      port: 6379
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  outbox:
    pending-replay-interval-ms: ${APP_OUTBOX_PENDING_REPLAY_INTERVAL_MS:15000}
    pending-reclaim-min-idle: ${APP_OUTBOX_PENDING_RECLAIM_MIN_IDLE:PT3M}
    pending-reclaim-batch-size: ${APP_OUTBOX_PENDING_RECLAIM_BATCH_SIZE:10}
    pending-reclaim-interval-ms: ${APP_OUTBOX_PENDING_RECLAIM_INTERVAL_MS:30000}

amha:
  chat:
    context-summary:
      preflight-enabled: ${AMHA_CHAT_CONTEXT_SUMMARY_PREFLIGHT_ENABLED:false}
      worker-enabled: ${AMHA_CHAT_CONTEXT_SUMMARY_WORKER_ENABLED:false}
      agent-enabled: ${AMHA_CHAT_CONTEXT_SUMMARY_AGENT_ENABLED:false}
      stream-key: ${AMHA_CHAT_CONTEXT_SUMMARY_STREAM_KEY:amha:outbox:context-summary}
      dispatch-interval-ms: ${AMHA_CHAT_CONTEXT_SUMMARY_DISPATCH_INTERVAL_MS:2000}
      batch-max-messages: ${AMHA_CHAT_CONTEXT_SUMMARY_BATCH_MAX_MESSAGES:40}
      batch-max-chars: ${AMHA_CHAT_CONTEXT_SUMMARY_BATCH_MAX_CHARS:16000}
      processing-lease: ${AMHA_CHAT_CONTEXT_SUMMARY_PROCESSING_LEASE:PT90S}
      max-history-messages: ${AMHA_CHAT_CONTEXT_SUMMARY_MAX_HISTORY_MESSAGES:39}
      recent-messages-to-keep: ${AMHA_CHAT_CONTEXT_SUMMARY_RECENT_MESSAGES_TO_KEEP:12}
      max-context-chars: ${AMHA_CHAT_CONTEXT_SUMMARY_MAX_CONTEXT_CHARS:32000}
      max-single-message-chars: ${AMHA_CHAT_CONTEXT_SUMMARY_MAX_SINGLE_MESSAGE_CHARS:8000}
      max-agent-request-bytes: ${AMHA_CHAT_CONTEXT_SUMMARY_MAX_AGENT_REQUEST_BYTES:65536}
      retry-after-ms: ${AMHA_CHAT_CONTEXT_SUMMARY_RETRY_AFTER_MS:5000}

server:
  port: 8080
  shutdown: graceful

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000

# File upload config
file:
  upload:
    backend: ${FILE_UPLOAD_BACKEND:${FILE_STORAGE_BACKEND:local}} # local | minio
    path: ./uploads
    allowed-extensions: jpg,jpeg,png,gif,webp
    max-size-bytes: 5242880
    max-image-pixels: 25000000
    s3:
      endpoint: ${FILE_UPLOAD_S3_ENDPOINT:${MINIO_ENDPOINT:}}
      bucket: ${FILE_UPLOAD_S3_BUCKET:${MINIO_BUCKET:}}
      access-key: ${FILE_UPLOAD_S3_ACCESS_KEY:${MINIO_ACCESS_KEY:}}
      secret-key: ${FILE_UPLOAD_S3_SECRET_KEY:${MINIO_SECRET_KEY:}}
    migration:
      enabled: ${FILE_STORAGE_MIGRATION_ENABLED:false}
      dry-run: ${FILE_STORAGE_MIGRATION_DRY_RUN:true}
      batch-size: ${FILE_STORAGE_MIGRATION_BATCH_SIZE:100}

# Python AI Agent config
agent:
  base-url: ${AGENT_BASE_URL:http://localhost:5000}
  internal-token: ${AGENT_INTERNAL_TOKEN:}
  chat-timeout-ms: ${AGENT_CHAT_TIMEOUT_MS:270000}
  context-summary-timeout-ms: ${AGENT_CONTEXT_SUMMARY_TIMEOUT_MS:65000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
